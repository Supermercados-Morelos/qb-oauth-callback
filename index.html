<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QuickBooks authorization</title>
<style>
body{font-family:system-ui,sans-serif;margin:3rem auto;max-width:36rem;padding:0 1rem;color:#222;background:#fff;line-height:1.45}
textarea{width:100%;height:7rem;font:12px/1.4 ui-monospace,monospace;padding:.5rem;box-sizing:border-box}
button{font:inherit;padding:.6rem 1rem;margin:.4rem .4rem .4rem 0;cursor:pointer}
#ok{color:#0a7a2f}
</style>
</head>
<body>
<h2 id="t">Authorization received</h2>
<div id="box">
<p>Thanks. To finish, send this link to the person who asked for the authorization. It is valid for about 10 minutes and works only once.</p>
<textarea id="u" readonly></textarea>
<button id="copy">Copy link</button>
<button id="local">I am on the computer running the loader</button>
<p id="ok"></p>
</div>
<script>
(function () {
  var q = window.location.search, box = document.getElementById("box");
  if (q.indexOf("code=") < 0) {
    document.getElementById("t").textContent = "Nothing to forward";
    box.innerHTML = "<p>Open this page only from the QuickBooks authorization link.</p>";
    return;
  }
  var target = "https://localhost:8765/callback" + q;
  document.getElementById("u").value = target;
  document.getElementById("copy").onclick = function () {
    var ta = document.getElementById("u"); ta.select();
    var done = function () { document.getElementById("ok").textContent = "Copied. Send it now."; };
    if (navigator.clipboard) { navigator.clipboard.writeText(target).then(done, function(){ document.execCommand("copy"); done(); }); }
    else { document.execCommand("copy"); done(); }
  };
  document.getElementById("local").onclick = function () { window.location.href = target; };
})();
</script>
</body>
</html>
